# Radar de Vulnerabilidades: exemplo de publicação interna no nginx.
# O painel mostra o mapa de vulnerabilidades da instituição: NUNCA o exponha à internet.
location /radar/ {
    alias /var/www/radar/;
    index index.html;

    # Ajuste para as redes internas e a VPN da instituição.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    # Opcional: autenticação (htpasswd) ou SSO institucional na frente.
    # auth_basic "Radar de Vulnerabilidades";
    # auth_basic_user_file /etc/nginx/radar.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;
    location ~ \.(sh|txt)$ { default_type text/plain; charset utf-8; }
}

# F7: receptor dos resultados. Os servidores enviam por HTTPS com token próprio.
# Libere só as redes dos servidores monitorados; o receptor escuta apenas em 127.0.0.1.
location /radar/api/ {
    proxy_pass http://127.0.0.1:8790/api/;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 4m;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
}

# Botão "Atualizar agora" do painel: quem vê o painel pode pedir uma coleta (no máximo uma a cada 15 min).
# Use aqui o MESMO controle de acesso do painel (redes e, se houver, auth_basic/SSO).
location = /radar/api/coleta {
    proxy_pass http://127.0.0.1:8790/api/coleta;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;   # o receptor confere a origem do pedido
    proxy_set_header X-Remote-User $remote_user;    # registra quem pediu, quando há auth_basic
    client_max_body_size 1k;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    # auth_basic "Radar de Vulnerabilidades";
    # auth_basic_user_file /etc/nginx/radar.htpasswd;
}
# O inventário consolidado lista servidores e suas falhas: mantenha o mesmo controle de acesso do painel.
