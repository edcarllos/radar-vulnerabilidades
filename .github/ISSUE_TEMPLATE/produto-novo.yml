name: Produto novo
description: Sugira um produto usado em instituições de ensino e pesquisa que o Radar ainda não acompanha.
title: "Produto novo: "
labels: ["produto-novo"]
body:
  - type: markdown
    attributes:
      value: "Issues são públicas: não informe servidores, versões instaladas, IPs ou o nome da sua instituição. Descreva o produto de forma geral."
  - type: input
    id: produto
    attributes:
      label: Produto e fornecedor
      placeholder: "Ex.: Koha (biblioteca)"
    validations:
      required: true
  - type: textarea
    id: uso
    attributes:
      label: Por que importa para instituições de ensino
      description: "Para que esse tipo de produto costuma ser usado (por exemplo, biblioteca, ensino a distância, rede). Não diga onde está instalado."
    validations:
      required: true
  - type: input
    id: avisos
    attributes:
      label: Página oficial de avisos de segurança
      description: "Se souber. Só fontes oficiais (fornecedor, NVD, distro)."
  - type: input
    id: cpe
    attributes:
      label: CPE na NVD
      description: "Se souber, por exemplo cpe:2.3:a:koha:koha"
